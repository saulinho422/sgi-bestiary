name: Deploy SGI Bestiary para GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Verificação de tipos (TypeScript)
        run: npm run typecheck

      - name: Executar testes automatizados (Vitest)
        run: npm test

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Gerar build de produção e validar caminhos de subdiretório
        shell: bash
        env:
          RAW_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
        run: |
          clean_base="${RAW_BASE_PATH#/}"
          clean_base="${clean_base%/}"
          if [ -z "${clean_base}" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${clean_base}/"
          fi
          export VITE_PUBLIC_ORIGIN="${PAGES_ORIGIN:-https://${GITHUB_REPOSITORY_OWNER}.github.io}"
          export VITE_HOMEPAGE_URL="https://github.com/${GITHUB_REPOSITORY}"
          echo "Build GitHub Pages: VITE_BASE_PATH=${VITE_BASE_PATH} VITE_PUBLIC_ORIGIN=${VITE_PUBLIC_ORIGIN}"
          npm run build
          npm run verify:dist

      - name: Enviar artefato estático (dist/) para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
